<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <!-- Perfect circular background in brand yellow/amber -->
  <circle cx="256" cy="256" r="240" fill="#f59e0b" />
  
  <!-- White Stylized glyph of 'py' -->
  <!-- We use high-quality overlapping stroke-based paths for perfect vector math and rounded ends -->
  <g stroke="white" stroke-width="36" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- The 'p' letter: stem and loop combined -->
    <path d="M 120,380 C 120,380 150,360 150,310 L 150,210 C 150,150 195,110 255,110 C 315,110 360,150 360,210 C 360,270 315,310 255,310 L 150,310" />
    
    <!-- The 'y' letter: right stem, bowl, and tail loop -->
    <path d="M 385,115 L 385,220 C 385,310 330,380 265,380 C 205,380 190,340 225,315 C 260,290 305,315 330,340" />
  </g>
  
  <!-- Clear crisp '.com' text -->
  <text x="282" y="325" fill="white" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="900" font-size="28" letter-spacing="-1.5">.com</text>
</svg>
